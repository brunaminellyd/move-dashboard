<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planejamento de conteúdo — MOVE</title>
<link rel="icon" type="image/png" href="./favicon-move.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--violet:#5B108F;--vl:#D084FF;--vd:#43096F;--vp:#F7EBFF;--bdr:#E4D9EB;--tm:#6B647A;--ok:#1E9E6A;--er:#C0392B;--fd:'Cormorant Garamond',Georgia,serif;--fb:'Jost',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;padding:14px;min-height:100vh;font-family:var(--fb);color:#030303;background:linear-gradient(135deg,#E6E8F1,#F1F1F1);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{background:#030303;color:#fff;border-radius:24px;padding:24px 22px}
.brand{font-family:var(--fd);font-size:28px;font-weight:700;letter-spacing:.08em;line-height:1}.brand em{font-style:italic;color:var(--vl)}
.sub{font-size:10.5px;letter-spacing:.22em;color:rgba(208,132,255,.85);margin:6px 0 20px}
.perfil{display:flex;align-items:center;gap:16px}.av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#5B108F,#D084FF);display:grid;place-items:center;font-family:var(--fd);font-size:30px;font-weight:600;flex:none}
.pf{min-width:0}h1{font-family:var(--fd);font-size:30px;font-weight:600;line-height:1.1;margin:0}
#per{color:var(--vl);font-size:13.5px;margin-top:4px}#stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}#stats span{font-size:11.5px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.88)}
main{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.8);border-radius:24px;padding:20px 18px;box-shadow:0 20px 44px rgba(30,58,123,.1)}
#erro{display:none;padding:40px 20px;text-align:center;background:#fff;border-radius:24px;color:var(--tm)}
button{font-family:var(--fb);font-size:14px;font-weight:500;border:0;border-radius:12px;padding:0 20px;min-height:44px;cursor:pointer;background:var(--violet);color:#fff;transition:all .28s}
button:hover{background:var(--vd)}button.sec{background:#fff;color:var(--violet);border:1.5px solid rgba(91,16,143,.3)}button.sec:hover{background:var(--vp)}
button.red{background:#fff;color:var(--er);border:1.5px solid var(--er)}button.red:hover{background:rgba(192,57,43,.08)}button.grn,.apr{background:var(--ok)}button.grn:hover,.apr:hover{background:#17835a}
.apr{width:100%;margin-bottom:14px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--bdr);border-radius:99px;padding:4px;margin-bottom:14px}.seg button{background:transparent;color:var(--tm);border-radius:99px;padding:0 20px;min-height:36px}.seg button.on{background:var(--violet);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.cell{aspect-ratio:3/4;background:#E4D9EB;position:relative;cursor:pointer;border-radius:10px;overflow:hidden;box-shadow:0 2px 20px rgba(45,8,72,.1)}
.ci{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:7px;right:7px;background:rgba(3,3,3,.65);color:#fff;font-size:11.5px;padding:2px 8px;border-radius:20px}
.st{position:absolute;bottom:7px;left:7px;font-size:11px;padding:2px 8px;border-radius:20px;color:#fff}.ok{background:var(--ok)}.aj{background:var(--er)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:11px}.wd{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tm);text-align:center}
.day{background:#fff;border:1px solid var(--bdr);min-height:80px;padding:5px;border-radius:10px}.chip{background:var(--vp);color:var(--violet);border-radius:6px;padding:2px 5px;margin-top:3px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lst{display:grid;grid-template-columns:1fr!important;gap:8px}.li{display:flex;gap:14px;background:#fff;border:1px solid var(--bdr);border-radius:12px;padding:12px 14px;cursor:pointer}.ld{min-width:84px;font-weight:600;color:var(--violet);font-size:13px;text-transform:capitalize}.lt{font-size:13.5px}.lt span{color:var(--tm)}
.rod{text-align:center;margin-top:22px;font-size:11px;letter-spacing:.06em;color:var(--tm);line-height:1.6}.rod em{font-family:var(--fd);font-size:13px;color:var(--violet)}
.modal{position:fixed;inset:0;background:rgba(3,3,3,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:8px;z-index:20}.modal.on{display:flex}
.box{background:#fff;border-radius:18px;width:min(640px,100%);max-height:96vh;overflow:auto}
.vis{position:relative;background:#000}.vis img,.vis video{width:100%;max-height:72vh;object-fit:contain;display:block}
.nav{position:absolute;top:45%;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:40px;height:40px;padding:0;min-height:0;font-size:22px}.nav:hover{background:rgba(0,0,0,.8)}.nav.l{left:8px}.nav.r{right:8px}
.cnt{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 10px;border-radius:10px}
.x{position:fixed;top:12px;right:12px;z-index:25;width:42px;height:42px;border-radius:50%;background:var(--er);color:#fff;font-size:26px;line-height:1;padding:0;min-height:0;box-shadow:0 2px 8px rgba(0,0,0,.4)}.x:hover{background:#a52e22}
.corpo{padding:18px}.corpo h4{font-family:var(--fd);font-size:24px;font-weight:600;margin:18px 0 6px}.leg{white-space:pre-wrap;font-size:15px;line-height:1.55}
.cm{background:#F1F1F1;border-radius:8px;padding:8px 10px;margin:5px 0;font-size:14px}.dtc{color:var(--tm);font-size:11.5px}
.acao{border:1px solid var(--bdr);border-radius:12px;padding:14px;margin-top:12px;background:#FBF6FE}.acao-t{font-weight:600;font-size:14px;margin-bottom:4px}.acao label{display:block;font-size:12px;color:var(--tm);margin-top:8px;font-weight:500}
.corpo input,.corpo textarea{width:100%;font:inherit;font-size:14px;padding:11px 13px;border:1.5px solid var(--bdr);border-radius:8px;background:#fff;outline:none;margin-top:4px}.corpo input:focus,.corpo textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(91,16,143,.1)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row button{flex:1}
@media(max-width:600px){.modal{padding:0}.box{width:100%;height:100%;max-height:100%;border-radius:0}.vis img,.vis video{max-height:62vh}h1{font-size:26px}.top{padding:20px 18px}}
.vis{overflow:hidden}.trk{display:flex;transition:transform .45s cubic-bezier(.4,0,.2,1);will-change:transform}
.sl{flex:0 0 100%;height:min(72vh,640px);display:flex;align-items:center;justify-content:center;background:#000}
.vis .sl img,.vis .sl video{width:100%;height:100%;max-height:none;object-fit:contain}
@media(max-width:600px){.sl{height:62vh}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
 <div class="brand">MO<em>VE</em></div><div class="sub">PLANEJAMENTO DE CONTEÚDO</div>
 <div class="perfil"><div class="av" id="av"></div><div class="pf"><h1 id="tit">Carregando…</h1><div id="per"></div><div id="stats"></div></div></div>
</header>
<div id="erro">Este link não está disponível.<br>Peça um novo link à equipe MOVE.</div>
<main id="main" style="display:none">
 <div class="seg"><button class="on" data-aba="g" onclick="aba('g')">Grade</button><button data-aba="c" onclick="aba('c')">Calendário</button></div>
 <button class="apr" onclick="aprovarTudo()">✓ Aprovar planejamento inteiro</button>
 <div id="vg" class="grid"></div><div id="vc" class="cal" style="display:none"></div>
 <div class="rod">MOVE Marketing<br><em>Planejamento visual de conteúdo</em></div>
</main>
</div>
<div class="modal" id="m"><button class="x" onclick="fechar()" aria-label="Fechar">×</button><div class="box">
 <div class="vis" id="vis"></div>
 <div class="corpo">
  <div id="inf" style="color:#666;font-size:13px"></div><p class="leg" id="leg"></p>
  <h4>Comentários</h4><div id="cms"></div>
  <div class="acao"><div class="acao-t">Sua resposta sobre esta publicação</div><label for="nome">Seu nome</label><input id="nome" placeholder="Ex.: Dr. André"><label for="txt">Comentário ou ajuste desejado</label><textarea id="txt" rows="3" placeholder="Escreva aqui o que você gostaria de ajustar"></textarea>
  <div id="msg" style="color:#c0392b"></div>
  <div class="row"><button class="grn" onclick="enviar('aprovado')">✓ Aprovar esta publicação</button><button class="red" onclick="enviar('ajuste')">Solicitar ajuste</button><button class="sec" onclick="enviar('comentario')">Comentar</button></div></div>
 </div>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore,collection,doc,getDoc,addDoc,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* COLE AQUI a mesma firebaseConfig do feed.html */
const firebaseConfig = {
  apiKey: "AIzaSyCwnBQwHmfl5F_fm93rsAL7RDguYcsHs0o",
  authDomain: "move-operacional.firebaseapp.com",
  projectId: "move-operacional",
  storageBucket: "move-operacional.firebasestorage.app",
  messagingSenderId: "988960038443",
  appId: "1:988960038443:web:1d28946abd5307974a146e"
};

const db=getFirestore(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const thumb=m=>!m?"":m.tipo==="video"?m.url.replace("/upload/","/upload/so_0,f_jpg,q_auto,w_500/").replace(/\.\w+$/,".jpg"):m.url.replace("/upload/","/upload/f_auto,q_auto,w_500/");
const grande=m=>m.url.replace("/upload/","/upload/f_auto,q_auto,w_1080/");
let plano=null,planId=null,posts=[],atual=null,idx=0,ulC=null,verAba="g";
$("nome").value=localStorage.getItem("moveNome")||"";

try{
 const t=new URLSearchParams(location.search).get("t");if(!t)throw 0;
 const s=await getDoc(doc(db,"feed_shares",t));if(!s.exists())throw 0;planId=s.data().planId;
 const p=await getDoc(doc(db,"feed_plans",planId));if(!p.exists()||!p.data().shareAtivo)throw 0;plano=p.data();plano.mes=plano.period||plano.mes||"2026-01";plano.inicio=plano.inicio||plano.mes+"-01";plano.fim=plano.fim||fimMes(plano.mes);plano.clienteNome=plano.clientName||plano.clienteNome;
 $("tit").textContent=plano.clienteNome;$("per").textContent=per(plano);
 $("av").textContent=plano.clienteNome.replace(/^(Dr\.|Dra\.)\s*/i,"").trim().slice(0,1).toUpperCase();$("main").style.display="block";
 onSnapshot(query(collection(db,"feed_plans",planId,"posts"),orderBy("ordem")),s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));acompanhar();desenhar()});
}catch(e){$("tit").textContent="";$("erro").style.display="block"}

window.aba=a=>{verAba=a;document.querySelectorAll("[data-aba]").forEach(b=>b.classList.toggle("on",b.dataset.aba===a));desenhar()};
function per(p){const a=p.inicio,b=p.fim,f=(s,y)=>new Date(s+"T12:00:00").toLocaleDateString("pt-BR",y?{day:"numeric",month:"short",year:"numeric"}:{day:"numeric",month:"short"}).replace(/\./g,"");
 if(a.slice(0,7)===b.slice(0,7))return new Date(a+"T12:00:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
 return f(a,a.slice(0,4)!==b.slice(0,4))+" a "+f(b,true)}
function fimMes(ym){const[y,m]=ym.split("-").map(Number);return ym+"-"+String(new Date(y,m,0).getDate()).padStart(2,"0")}
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const capa=m=>!m?"":`<img class="ci" loading="lazy" alt="" src="${thumb(m)}"${m.tipo==="video"?"":` onerror="this.onerror=null;this.src='${m.url}'"`}>`;
const stat={},ulS={};
const dtc=c=>c.criadoEm&&c.criadoEm.toDate?c.criadoEm.toDate().toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"agora";
function listaHTML(){const l=[...posts].sort((x,y)=>(x.dataPrevista||"9").localeCompare(y.dataPrevista||"9"));
 return l.map(p=>{const dt=p.dataPrevista?new Date(p.dataPrevista+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"}):"Sem data";
  return `<div class="li" onclick="abrir('${p.id}')"><div class="ld">${dt}</div><div class="lt">${p.tipo==="reels"?"▶ Reels":p.tipo==="carrossel"?"❐ Carrossel":"■ Estático"}<br><span>${esc((p.legenda||"Sem legenda").slice(0,90))}</span></div></div>`}).join("")||"<p>Nenhuma publicação ainda.</p>"}
matchMedia("(max-width:700px)").addEventListener("change",()=>plano&&desenhar());
function acompanhar(){posts.forEach(p=>{if(ulS[p.id])return;ulS[p.id]=onSnapshot(query(collection(db,"feed_plans",planId,"posts",p.id,"comentarios"),orderBy("criadoEm")),s=>{const l=s.docs.map(d=>d.data()).filter(x=>x.tipo!=="comentario").pop();stat[p.id]=l?l.tipo:"";desenhar()})})}
window.aprovarTudo=async()=>{const pend=posts.filter(p=>stat[p.id]!=="aprovado");if(!pend.length)return alert("Todos os posts já estão aprovados.");
 const nome=prompt("Seu nome, para registrar a aprovação:",localStorage.getItem("moveNome")||"");if(!nome||!nome.trim())return;
 if(!confirm("Aprovar os "+pend.length+" posts pendentes?"))return;
 try{for(const p of pend)await addDoc(collection(db,"feed_plans",planId,"posts",p.id,"comentarios"),{autor:nome.trim().slice(0,80),texto:"Aprovado (planejamento inteiro)",tipo:"aprovado",criadoEm:serverTimestamp()});
  localStorage.setItem("moveNome",nome.trim());alert("Planejamento aprovado. Obrigado!")}catch(e){alert("Não foi possível enviar. Tente novamente.")}};
function desenhar(){const ap=posts.filter(p=>stat[p.id]==="aprovado").length;$("stats").innerHTML="<span>"+posts.length+(posts.length===1?" publicação":" publicações")+"</span><span>"+ap+(ap===1?" aprovada":" aprovadas")+"</span>";$("vg").style.display=verAba==="g"?"grid":"none";$("vc").style.display=verAba==="c"?"grid":"none";
 $("vg").innerHTML=posts.map(p=>`<div class="cell" onclick="abrir('${p.id}')">${capa(p.midias?.[0])}<span class="tag">${p.tipo==="reels"?"▶ Reels":p.tipo==="carrossel"?"❐ "+(p.midias||[]).length:""}</span>${stat[p.id]==="aprovado"?'<span class="st ok">✓ aprovado</span>':stat[p.id]==="ajuste"?'<span class="st aj">ajuste</span>':""}</div>`).join("");
 const di=new Date(plano.inicio+"T12:00:00"),df=new Date(plano.fim+"T12:00:00");
 let h=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(d=>`<div class="wd">${d}</div>`).join("");
 for(let i=0;i<di.getDay();i++)h+="<div></div>";
 for(let d=new Date(di);d<=df;d.setDate(d.getDate()+1)){const k=iso(d),t=(d.getDate()===1||k===plano.inicio)?d.getDate()+" "+d.toLocaleDateString("pt-BR",{month:"short"}).replace(".",""):d.getDate();
  h+=`<div class="day"><b>${t}</b>${posts.filter(p=>p.dataPrevista===k).map(p=>`<div class="chip" onclick="abrir('${p.id}')">${p.tipo==="reels"?"▶":p.tipo==="carrossel"?"❐":"■"} ${esc((p.legenda||"").slice(0,18))||"post"}</div>`).join("")}</div>`}
 const mob=matchMedia("(max-width:700px)").matches;$("vc").className=mob?"lst":"cal";$("vc").innerHTML=mob?listaHTML():h}
window.abrir=id=>{atual=posts.find(p=>p.id===id);idx=0;slide();
 $("inf").textContent=(atual.tipo==="reels"?"Reels":atual.tipo==="carrossel"?"Carrossel":"Post estático")+(atual.dataPrevista?" • publicação prevista: "+atual.dataPrevista.split("-").reverse().join("/"):"");
 $("leg").textContent=atual.legenda||"";$("msg").textContent="";$("txt").value="";ulC&&ulC();
 ulC=onSnapshot(query(collection(db,"feed_plans",planId,"posts",id,"comentarios"),orderBy("criadoEm")),s=>{
  $("cms").innerHTML=s.docs.map(d=>d.data()).map(c=>`<div class="cm"><b>${esc(c.autor)}</b> ${c.tipo==="ajuste"?"🔴 solicitou ajuste":c.tipo==="aprovado"?"🟢 aprovou":""}<small class="dtc"> · ${dtc(c)}</small><br>${esc(c.texto)}</div>`).join("")||"<small>Nenhum comentário ainda.</small>"});
 $("m").classList.add("on")};
function slide(){const ms=atual.midias||[];
 $("vis").innerHTML=ms.length?'<div class="trk" id="trk" style="transform:translateX(0)">'+ms.map(m=>'<div class="sl">'+(m.tipo==="video"?'<video src="'+m.url+'" controls playsinline preload="metadata"></video>':'<img src="'+grande(m)+'" alt="" decoding="async">')+'</div>').join('')+'</div>'+(ms.length>1?'<button class="nav l" onclick="go(-1)">‹</button><button class="nav r" onclick="go(1)">›</button><span class="cnt" id="cnt">1/'+ms.length+'</span>':''):''}
window.go=n=>{const t=atual.midias.length;if(t<2)return;idx=(idx+n+t)%t;const tr=$("trk");if(tr)tr.style.transform="translateX("+(-idx*100)+"%)";const ct=$("cnt");if(ct)ct.textContent=(idx+1)+"/"+t;document.querySelectorAll("#vis video").forEach(v=>v.pause())};
window.fechar=()=>{ulC&&ulC();ulC=null;$("vis").innerHTML="";$("m").classList.remove("on")};
document.addEventListener("keydown",e=>{if(!$("m").classList.contains("on"))return;if(e.key==="Escape")fechar();if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
$("m").addEventListener("click",e=>{if(e.target.id==="m")fechar()});
let tx=0;$("vis").addEventListener("touchstart",e=>{tx=e.changedTouches[0].clientX},{passive:true});
$("vis").addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50&&atual&&atual.midias.length>1)go(d<0?1:-1)},{passive:true});
window.enviar=async tipo=>{const nome=$("nome").value.trim(),txt=$("txt").value.trim(),msg=$("msg");
 if(!nome)return msg.textContent="Informe seu nome.";
 if(tipo!=="aprovado"&&!txt)return msg.textContent="Escreva o comentário.";
 try{await addDoc(collection(db,"feed_plans",planId,"posts",atual.id,"comentarios"),{autor:nome.slice(0,80),texto:(txt||"Aprovado").slice(0,1000),tipo,criadoEm:serverTimestamp()});
  localStorage.setItem("moveNome",nome);$("txt").value="";msg.textContent="";
 }catch(e){msg.textContent="Não foi possível enviar. Tente novamente."}};
</script>
</body>
</html>
